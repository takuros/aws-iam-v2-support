# このファイルは npm run cfn で生成しています。手で直さず、lib/ と bin/settings.ts を直して作り直します。
# CloudFormation で直接デプロイするなら、example- で始まる値などを自分の値に替えます（README の「差し替える値」）。
Description: Developer role without role creation
Resources:
  DeveloperRole745A238E:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:user/example-signin-user
        Version: 2012-10-17
      Description: Developer role
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/PowerUserAccess
      MaxSessionDuration: 3600
      RoleName: human-developer-simple-readwrite
  DeveloperRoleDefaultPolicy8467853B:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - iam:Create*
              - iam:Delete*
              - iam:Update*
            Effect: Deny
            Resource: "*"
          - Action: sts:AssumeRole
            Effect: Deny
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::*:role/cdk-*
            Sid: DenyAssumeCdkBootstrapRoles
          - Action:
              - aws-portal:*
              - bcm-dashboards:*
              - bcm-data-exports:*
              - bcm-pricing-calculator:*
              - bcm-recommended-actions:*
              - billing:*
              - billingconductor:*
              - budgets:*
              - ce:*
              - consolidatedbilling:*
              - cost-optimization-hub:*
              - cur:*
              - freetier:*
              - invoicing:*
              - mapcredits:*
              - payments:*
              - purchase-orders:*
              - savingsplans:*
              - sustainability:*
              - tax:*
            Effect: Deny
            Resource: "*"
            Sid: DenyBillingAccess
        Version: 2012-10-17
      PolicyName: DeveloperRoleDefaultPolicy8467853B
      Roles:
        - Ref: DeveloperRole745A238E
