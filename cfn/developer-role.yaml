# このファイルは npm run cfn で生成しています。手で直さず、lib/ と bin/settings.ts を直して作り直します。
# CloudFormation で直接デプロイするなら、example- で始まる値などを自分の値に替えます（README の「差し替える値」）。
Description: Developer role with Permissions Boundary
Resources:
  DeveloperDeveloperBoundaryBD44BEFE:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: ""
      ManagedPolicyName: DeveloperBoundary
      Path: /
      PolicyDocument:
        Statement:
          - Action:
              - cloudwatch:*
              - dynamodb:*
              - ec2:*
              - lambda:*
              - logs:*
              - s3:*
            Effect: Allow
            Resource: "*"
            Sid: AllowDeveloperServices
          - Action:
              - iam:AttachRolePolicy
              - iam:CreateRole
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
              - iam:PutRolePolicy
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dev-*
            Sid: AllowDelegatedIam
          - Action: iam:PassRole
            Condition:
              StringEquals:
                iam:PassedToService:
                  - lambda.amazonaws.com
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dev-*
            Sid: AllowPassDevRoles
          - Action:
              - iam:CreateServiceLinkedRole
              - iam:ListRoles
            Effect: Allow
            Resource: "*"
            Sid: AllowServiceLinkedRolesAndListRoles
          - Action:
              - iam:CreatePolicyVersion
              - iam:DeleteRolePermissionsBoundary
              - iam:PutRolePermissionsBoundary
              - organizations:*
            Effect: Deny
            Resource: "*"
            Sid: DenyBoundaryRemovalAndOrganizations
        Version: 2012-10-17
  DeveloperRole745A238E:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:user/example-signin-user
        Version: 2012-10-17
      Description: Developer role
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/PowerUserAccess
      MaxSessionDuration: 3600
      PermissionsBoundary:
        Ref: DeveloperDeveloperBoundaryBD44BEFE
      RoleName: human-developer-readwrite
  DeveloperRoleDefaultPolicy8467853B:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - iam:AttachRolePolicy
              - iam:CreateRole
              - iam:DeleteRole
              - iam:DeleteRolePolicy
              - iam:DetachRolePolicy
              - iam:PutRolePolicy
            Condition:
              StringEquals:
                iam:PermissionsBoundary:
                  Ref: DeveloperDevTeamBoundary1DE50BF3
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dev-*
            Sid: AllowManageDevRolesWithBoundary
          - Action:
              - iam:GetRole
              - iam:GetRolePolicy
              - iam:ListAttachedRolePolicies
              - iam:ListRolePolicies
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dev-*
            Sid: AllowReadDevRoles
          - Action: iam:PassRole
            Condition:
              StringEquals:
                iam:PassedToService:
                  - lambda.amazonaws.com
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/dev-*
            Sid: AllowPassDevRoles
        Version: 2012-10-17
      PolicyName: DeveloperRoleDefaultPolicy8467853B
      Roles:
        - Ref: DeveloperRole745A238E
  DeveloperDevTeamBoundary1DE50BF3:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: ""
      ManagedPolicyName: DevTeamBoundary
      Path: /
      PolicyDocument:
        Statement:
          - Action:
              - s3:*
              - dynamodb:*
              - logs:*
              - lambda:*
            Effect: Allow
            Resource: "*"
          - Action:
              - iam:*
              - organizations:*
              - sts:AssumeRole
            Effect: Deny
            Resource: "*"
        Version: 2012-10-17
