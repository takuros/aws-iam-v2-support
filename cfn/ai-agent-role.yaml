# このファイルは npm run cfn で生成しています。手で直さず、lib/ と bin/settings.ts を直して作り直します。
# CloudFormation で直接デプロイするなら、example- で始まる値などを自分の値に替えます（README の「差し替える値」）。
Description: AI agent role and related policies
Resources:
  AgentRole9D587F56:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:user/example-signin-user
        Version: 2012-10-17
      Description: AI agent role, separated from human roles
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/job-function/ViewOnlyAccess
        - Ref: AgentBedrockInvoke22D8C73C
        - Ref: AgentSecretsReadFD5D9A9A
      MaxSessionDuration: 3600
      RoleName: agent-assistant-readonly
  AgentRoleDefaultPolicyA34CCA36:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - cloudtrail:DeleteTrail
              - cloudtrail:StopLogging
              - dynamodb:DeleteTable
              - ec2:TerminateInstances
              - iam:Attach*
              - iam:Create*
              - iam:Delete*
              - iam:PassRole
              - iam:Put*
              - iam:Update*
              - kms:ScheduleKeyDeletion
              - lambda:DeleteFunction
              - logs:DeleteLogGroup
              - rds:DeleteDBCluster
              - rds:DeleteDBInstance
              - s3:DeleteBucket
              - s3:DeleteObject
              - s3:DeleteObjectVersion
              - secretsmanager:DeleteSecret
              - secretsmanager:PutSecretValue
              - secretsmanager:UpdateSecret
            Effect: Deny
            Resource: "*"
            Sid: DenyDestructiveActions
        Version: 2012-10-17
      PolicyName: AgentRoleDefaultPolicyA34CCA36
      Roles:
        - Ref: AgentRole9D587F56
  AgentBedrockInvoke22D8C73C:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: ""
      ManagedPolicyName: agent-assistant-readonly-bedrock-invoke
      Path: /
      PolicyDocument:
        Statement:
          - Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:bedrock:ap-northeast-1:${AWS::AccountId}:inference-profile/jp.anthropic.claude-*
            Sid: InvokeInferenceProfiles
          - Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
            Condition:
              ArnLike:
                bedrock:InferenceProfileArn:
                  Fn::Sub: arn:${AWS::Partition}:bedrock:ap-northeast-1:${AWS::AccountId}:inference-profile/jp.anthropic.claude-*
            Effect: Allow
            Resource:
              - Fn::Sub: arn:${AWS::Partition}:bedrock:ap-northeast-1::foundation-model/anthropic.claude-*
              - Fn::Sub: arn:${AWS::Partition}:bedrock:ap-northeast-3::foundation-model/anthropic.claude-*
            Sid: InvokeModelsThroughInferenceProfiles
        Version: 2012-10-17
  AgentSecretsReadFD5D9A9A:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: ""
      ManagedPolicyName: agent-assistant-readonly-secrets-read
      Path: /
      PolicyDocument:
        Statement:
          - Action:
              - secretsmanager:DescribeSecret
              - secretsmanager:GetSecretValue
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:myapp/*
            Sid: ReadAppSecretsOnly
        Version: 2012-10-17
  AssumeAndPassPolicy29F1FCB3:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Limits AssumeRole and PassRole to role/agent-*
      ManagedPolicyName: AgentAssumeAndPass
      Path: /
      PolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/agent-*
            Sid: AssumeAgentRoles
          - Action: iam:PassRole
            Condition:
              StringEquals:
                iam:PassedToService:
                  - lambda.amazonaws.com
                  - bedrock-agentcore.amazonaws.com
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/agent-*
            Sid: PassAgentRolesToServices
        Version: 2012-10-17
  DenyViaMcpPolicyF0BF17FD:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Denies destructive actions called through AWS managed MCP services
      ManagedPolicyName: DenyDestructiveViaMcp
      Path: /
      PolicyDocument:
        Statement:
          - Action:
              - dynamodb:DeleteTable
              - s3:DeleteBucket
              - s3:DeleteObject
            Condition:
              Bool:
                aws:ViaAWSMCPService: "true"
            Effect: Deny
            Resource: "*"
            Sid: DenyDestructiveViaMcp
        Version: 2012-10-17
