# CloudFormation で直接デプロイするなら、example- で始まる値などを自分の値に替えます（README の「差し替える値」）。
Description: Billing viewer role
Resources:
  BillingViewerRole08F09F89:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:user/example-signin-user
        Version: 2012-10-17
      Description: Billing and Cost Explorer viewer role
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/AWSBillingReadOnlyAccess
      MaxSessionDuration: 3600
      RoleName: human-billing-readonly
  BillingViewerRoleDefaultPolicy7AE256ED:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - ce:DescribeReport
              - ce:GetCostAndUsageWithResources
              - ce:GetCostCategories
              - ce:GetCostForecast
              - ce:GetReservationPurchaseRecommendation
              - ce:GetReservationUtilization
              - ce:GetUsageForecast
            Effect: Allow
            Resource: "*"
            Sid: AllowCostExplorerRead
        Version: 2012-10-17
      PolicyName: BillingViewerRoleDefaultPolicy7AE256ED
      Roles:
        - Ref: BillingViewerRole08F09F89
