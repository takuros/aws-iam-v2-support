Description: Break-glass IAM users and group
Resources:
  BreakGlassGroupC67E0B8E:
    Type: AWS::IAM::Group
    Properties:
      GroupName: break-glass
  BreakGlassPolicy88954D29:
    Type: AWS::IAM::Policy
    Properties:
      Groups:
        - Ref: BreakGlassGroupC67E0B8E
      PolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Effect: Allow
            Resource:
              Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:role/human-account-admin
