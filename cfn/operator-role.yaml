# このファイルは npm run cfn で生成しています。手で直さず、lib/ と bin/settings.ts を直して作り直します。
# CloudFormation で直接デプロイするなら、example- で始まる値などを自分の値に替えます（README の「差し替える値」）。
Description: Operator role
Resources:
  OperatorRoleE90607EC:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:user/example-signin-user
        Version: 2012-10-17
      Description: Operator role for monitoring and incident response
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/ReadOnlyAccess
      MaxSessionDuration: 3600
      RoleName: human-operator-readwrite
  OperatorRoleDefaultPolicy73288FDA:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - cloudwatch:DisableAlarmActions
              - cloudwatch:EnableAlarmActions
              - ec2:RebootInstances
              - ec2:StartInstances
              - ec2:StopInstances
              - rds:RebootDBInstance
            Effect: Allow
            Resource: "*"
            Sid: AllowIncidentResponse
          - Action:
              - aws-portal:*
              - bcm-dashboards:*
              - bcm-data-exports:*
              - bcm-pricing-calculator:*
              - bcm-recommended-actions:*
              - billing:*
              - billingconductor:*
              - budgets:*
              - ce:*
              - consolidatedbilling:*
              - cost-optimization-hub:*
              - cur:*
              - freetier:*
              - invoicing:*
              - mapcredits:*
              - payments:*
              - purchase-orders:*
              - savingsplans:*
              - sustainability:*
              - tax:*
            Effect: Deny
            Resource: "*"
            Sid: DenyBillingAccess
        Version: 2012-10-17
      PolicyName: OperatorRoleDefaultPolicy73288FDA
      Roles:
        - Ref: OperatorRoleE90607EC
