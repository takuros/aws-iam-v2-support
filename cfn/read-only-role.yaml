Description: Read-only role
Resources:
  ReadOnlyRole9ED5F812:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Action: sts:AssumeRole
            Condition:
              Bool:
                aws:MultiFactorAuthPresent: "true"
            Effect: Allow
            Principal:
              AWS:
                Fn::Sub: arn:${AWS::Partition}:iam::${AWS::AccountId}:user/example-signin-user
        Version: 2012-10-17
      Description: Read-only role for audit and review
      ManagedPolicyArns:
        - Fn::Join:
            - ""
            - - "arn:"
              - Ref: AWS::Partition
              - :iam::aws:policy/ReadOnlyAccess
      MaxSessionDuration: 3600
      RoleName: human-auditor-readonly
  ReadOnlyRoleDefaultPolicy8705D65D:
    Type: AWS::IAM::Policy
    Properties:
      PolicyDocument:
        Statement:
          - Action:
              - aws-portal:*
              - bcm-dashboards:*
              - bcm-data-exports:*
              - bcm-pricing-calculator:*
              - bcm-recommended-actions:*
              - billing:*
              - billingconductor:*
              - budgets:*
              - ce:*
              - consolidatedbilling:*
              - cost-optimization-hub:*
              - cur:*
              - freetier:*
              - invoicing:*
              - mapcredits:*
              - payments:*
              - purchase-orders:*
              - savingsplans:*
              - sustainability:*
              - tax:*
            Effect: Deny
            Resource: "*"
            Sid: DenyBillingAccess
        Version: 2012-10-17
      PolicyName: ReadOnlyRoleDefaultPolicy8705D65D
      Roles:
        - Ref: ReadOnlyRole9ED5F812
